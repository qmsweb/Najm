<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Najm 0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Cairo', 'sans-serif'] },
            colors: {
              background: '#09090b',
              surface: '#18181b',
              primary: '#3b82f6',
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-in': 'slideIn 0.3s ease-out',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideIn: { '0%': { transform: 'translateY(10px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
            }
          },
        },
      }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>

    <style>
      body {
        background-color: #09090b;
        color: #e4e4e7;
        height: 100dvh; 
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
      .prose { max-width: none; font-size: 0.95rem; line-height: 1.8; }
      .prose p { margin-bottom: 0.75rem; }
      .prose strong { color: #60a5fa; font-weight: 700; }
      .prose h1, .prose h2, .prose h3 { color: #f4f4f5; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; }
      .prose ul { list-style-type: disc; padding-right: 1.25rem; margin-bottom: 1rem; color: #d4d4d8; }
      .prose code { background: #27272a; padding: 0.2rem 0.4rem; rounded: 4px; font-family: monospace; color: #e879f9; font-size: 0.85em; }
      .glass-panel {
        background: rgba(24, 24, 27, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255,255,255,0.08);
      }
      .typing-dot {
        width: 6px; height: 6px; background: #71717a; border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out both;
      }
      .typing-dot:nth-child(1) { animation-delay: -0.32s; }
      .typing-dot:nth-child(2) { animation-delay: -0.16s; }
      @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="flex flex-col md:flex-row h-[100dvh]">

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity duration-300 md:hidden backdrop-blur-sm"></div>

    <aside id="sidebar" class="fixed inset-y-0 right-0 z-50 w-[280px] bg-[#121214] border-l border-white/5 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col md:relative md:translate-x-0 shadow-2xl md:shadow-none">
        <div class="p-5 flex items-center justify-between border-b border-white/5">
            <h2 class="font-bold text-lg text-white flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                محفوظات الدردشة
            </h2>
            <button onclick="toggleSidebar()" class="p-2 text-gray-400 hover:text-white rounded-full md:hidden active:bg-white/10">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="px-4 py-4">
            <button onclick="startNewChat()" class="flex items-center justify-center gap-2 w-full bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl transition-all shadow-lg shadow-blue-900/20 active:scale-95">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>
                <span class="font-medium">محادثة جديدة</span>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-2 space-y-1" id="history-list">
            <div class="px-4 py-2 text-xs font-semibold text-gray-500 mt-2 uppercase tracking-wider">اليوم</div>
            <button class="w-full text-right px-4 py-3 rounded-lg hover:bg-white/5 text-sm text-gray-300 transition-colors truncate">
                معنى كلمة "سجال"
            </button>
        </div>
        
        <div class="p-4 border-t border-white/5">
             <button class="flex items-center gap-3 w-full p-2 rounded-lg hover:bg-white/5 text-sm text-gray-400 transition-colors">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                <span>حول نجم</span>
             </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative w-full h-full bg-[#09090b]">
        
        <header class="flex items-center justify-between p-4 z-30 sticky top-0 glass-panel md:hidden">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold">ن</div>
                <span class="font-bold text-lg text-white">نجم</span>
            </div>
            <button id="open-sidebar-btn" onclick="toggleSidebar()" class="p-2 text-gray-300 hover:bg-white/10 rounded-full transition-colors active:scale-90">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </header>

        <header class="hidden md:flex items-center justify-between p-4 px-8 border-b border-white/5">
             <div class="flex items-center gap-3">
                <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-l from-blue-400 to-indigo-400">نجم</span>
                <span class="px-2 py-0.5 rounded text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20">BETA</span>
            </div>
        </header>

        <div id="chat-feed" class="flex-1 overflow-y-auto px-4 pb-4 scroll-smooth">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center p-6 text-center animate-fade-in">
                <div class="w-20 h-20 bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl flex items-center justify-center mb-6 shadow-2xl border border-white/5">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-blue-400"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                </div>
                <h2 class="text-2xl font-bold mb-3 text-white">مرحباً، أنا نجم</h2>
                <p class="text-gray-400 max-w-sm text-sm leading-relaxed">
                    خبيرك الذكي في فقه اللغة العربية.
                    <br>اسألني عن أصول الكلمات، الفروق اللغوية، أو الشواهد الشعرية.
                </p>
                
                <div class="mt-8 flex flex-wrap justify-center gap-2">
                    <button onclick="fillInput('ما الفرق بين الحمد والشكر؟')" class="px-4 py-2 bg-[#1f1f22] hover:bg-[#27272a] text-gray-300 text-xs rounded-full border border-white/5 transition-colors">الفرق بين الحمد والشكر؟</button>
                    <button onclick="fillInput('ما أصل كلمة تفلسف؟')" class="px-4 py-2 bg-[#1f1f22] hover:bg-[#27272a] text-gray-300 text-xs rounded-full border border-white/5 transition-colors">أصل كلمة "تفلسف"</button>
                </div>
            </div>
            
            <div id="messages-container" class="max-w-3xl mx-auto py-6 space-y-6 hidden pb-32"></div>
        </div>

        <div class="w-full glass-panel z-20 pb-safe pt-2">
            <div class="max-w-3xl mx-auto px-4 pb-4">
                <div class="relative bg-[#1f1f22] rounded-3xl border border-gray-700/50 focus-within:border-blue-500/50 focus-within:ring-1 focus-within:ring-blue-500/20 transition-all duration-300 shadow-lg">
                    <textarea 
                        id="user-input"
                        rows="1"
                        placeholder="اطرح سؤالك اللغوي هنا..."
                        class="w-full bg-transparent text-gray-100 placeholder-gray-500 px-5 py-4 pl-12 rounded-3xl resize-none outline-none max-h-[150px] overflow-y-auto text-[16px]"
                        style="min-height: 56px;"
                    ></textarea>

                    <div class="absolute bottom-2 left-2 flex items-center">
                        <button id="send-btn" class="p-2.5 bg-blue-600 text-white rounded-full transition-all duration-200 transform scale-0 disabled:opacity-0 disabled:scale-0 shadow-lg shadow-blue-900/30">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
                <p class="text-center text-[10px] text-gray-600 mt-2">نجم نموذج ذكاء اصطناعي قد يخطئ، يرجى التحقق من المصادر.</p>
            </div>
        </div>
    </main>

    <script type="module">
        // التغيير هنا: استخدام مكتبة generative-ai المستقرة بدلاً من genai
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // --- Configuration ---
        const CLOUDFLARE_WORKER_URL = "https://yellow-bread-e187.najm-ai.workers.dev"; 
        
        const SYSTEM_INSTRUCTION = `أنت "نجم"، خبير لغوي متخصص في اللغة العربية، تجيب بدقة وبلاغة مع الاستشهاد بالمعاجم.`;

        // --- State ---
        let genAI = null; // تغيير اسم المتغير
        let model = null;
        let chatSession = null;
        let isProcessing = false;
        let apiKey = null;

        // --- Elements ---
        const els = {
            input: document.getElementById('user-input'),
            sendBtn: document.getElementById('send-btn'),
            messages: document.getElementById('messages-container'),
            empty: document.getElementById('empty-state'),
            feed: document.getElementById('chat-feed'),
            sidebar: document.getElementById('sidebar'),
            overlay: document.getElementById('sidebar-overlay')
        };

        // --- Sidebar Logic ---
        window.toggleSidebar = () => {
            const isHidden = els.sidebar.classList.contains('translate-x-full');
            if (isHidden) {
                els.sidebar.classList.remove('translate-x-full');
                els.overlay.classList.remove('hidden');
                if(window.innerWidth < 768) document.body.style.overflow = 'hidden';
            } else {
                els.sidebar.classList.add('translate-x-full');
                els.overlay.classList.add('hidden');
                document.body.style.overflow = '';
            }
        };

        window.startNewChat = () => {
            chatSession = null;
            els.messages.innerHTML = '';
            els.messages.classList.add('hidden');
            els.empty.classList.remove('hidden');
            if (window.innerWidth < 768) toggleSidebar();
        };
        
        window.fillInput = (text) => {
            els.input.value = text;
            els.input.dispatchEvent(new Event('input'));
            els.input.focus();
        };

        // --- Chat Logic ---
        els.input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
            const hasText = this.value.trim().length > 0;
            if (hasText && !isProcessing) {
                els.sendBtn.disabled = false;
                els.sendBtn.classList.remove('scale-0', 'opacity-0');
                els.sendBtn.classList.add('scale-100', 'opacity-100');
            } else {
                els.sendBtn.classList.remove('scale-100', 'opacity-100');
                els.sendBtn.classList.add('scale-0', 'opacity-0');
            }
        });

        els.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        els.sendBtn.addEventListener('click', handleSend);

        async function fetchApiKey() {
            try {
                const response = await fetch(CLOUDFLARE_WORKER_URL);
                if (!response.ok) throw new Error("فشل الاتصال بالخادم");
                const data = await response.json();
                return data.key;
            } catch (err) {
                console.error("Error fetching key:", err);
                return null;
            }
        }

        async function handleSend() {
            const text = els.input.value.trim();
            if (!text || isProcessing) return;

            isProcessing = true;
            els.input.value = '';
            els.input.style.height = '56px';
            els.sendBtn.classList.add('scale-0');
            els.empty.classList.add('hidden');
            els.messages.classList.remove('hidden');

            appendMessage(text, 'user');

            const aiId = `ai-${Date.now()}`;
            appendMessage('', 'model', aiId, true);

            try {
                if (!apiKey) {
                    apiKey = await fetchApiKey();
                    if (!apiKey) throw new Error("تعذر الحصول على مفتاح API");
                }

                // التهيئة باستخدام المكتبة المستقرة
                if (!genAI) genAI = new GoogleGenerativeAI(apiKey);
                
                if (!chatSession) {
                    model = genAI.getGenerativeModel({ 
                        model: "gemini-1.5-flash-preview",
                        systemInstruction: SYSTEM_INSTRUCTION 
                    });
                    
                    chatSession = model.startChat();
                }

                const result = await chatSession.sendMessageStream(text);
                
                let fullText = '';
                const contentDiv = document.querySelector(`#${aiId} .prose`);
                const loader = document.querySelector(`#${aiId} .loading-dots`);
                
                for await (const chunk of result.stream) {
                    if(loader) loader.style.display = 'none';
                    const chunkText = chunk.text();
                    fullText += chunkText;
                    contentDiv.innerHTML = marked.parse(fullText);
                    scrollToBottom();
                }

            } catch (error) {
                console.error(error);
                const contentDiv = document.querySelector(`#${aiId} .prose`);
                if(contentDiv) contentDiv.innerHTML = `<span class="text-red-400 text-sm bg-red-900/20 px-2 py-1 rounded">⚠️ حدث خطأ: ${error.message}</span>`;
                const loader = document.querySelector(`#${aiId} .loading-dots`);
                if(loader) loader.remove();
            } finally {
                isProcessing = false;
                const loader = document.querySelector(`#${aiId} .loading-dots`);
                if(loader) loader.remove();
            }
        }

        function appendMessage(content, role, id = null, isLoading = false) {
            const div = document.createElement('div');
            if (id) div.id = id;
            div.className = `flex gap-3 w-full animate-slide-in ${role === 'user' ? 'justify-start' : ''}`;
            
            const avatar = role === 'model' 
                ? `<div class="w-8 h-8 flex-shrink-0 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-white text-xs font-bold shadow-lg shadow-blue-900/20 mt-1">ن</div>`
                : `<div class="w-8 h-8 flex-shrink-0 rounded-full bg-[#27272a] flex items-center justify-center text-gray-400 mt-1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>`;

            const loadingHTML = isLoading 
                ? `<div class="loading-dots flex gap-1 mt-2 h-6 items-center">
                     <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
                   </div>` 
                : '';

            div.innerHTML = `
                ${avatar}
                <div class="flex-1 min-w-0 pt-1">
                    <div class="font-medium text-xs mb-1 text-gray-500">${role === 'model' ? 'نجم' : 'أنت'}</div>
                    <div class="prose text-gray-200 dir-rtl">
                        ${content ? marked.parse(content) : ''}
                    </div>
                    ${loadingHTML}
                </div>
            `;
            els.messages.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            els.feed.scrollTo({ top: els.feed.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
